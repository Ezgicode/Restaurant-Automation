
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yemek Tanıma Sonucu</title>
    <style>
        body {
            background-color: #f8e5e5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            font-size: 40px;
            color: #222;
        }
        img {
            margin-top: 30px;
            width: 400px;
            border: 3px solid #c00;
            border-radius: 8px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 40px;
        }
        li {
            font-size: 24px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<h1>Fotoğraf Çekildi</h1>
<img src="{{ url_for('static', filename='tahmin.jpg') }}">

{% if predicted_names != "Tespit edilemedi" %}
  <ul>
    {% for yemek in predicted_names %}
      <li>{{ yemek }}</li>
    {% endfor %}
    {% for fiyat in fiyatlar %}
      <li>{{ fiyat }} TL</li>
    {% endfor %}
  </ul>
{% else %}
  <h2>Yemek bulunamadı</h2>
{% endif %}

</body>
</html>
