<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Restoran Otomasyon Sistemi</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .banner {
            width: 100%;
            height: 250px;
            background-image: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092'); /* Örnek yemek görseli */
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 48px;
            color: #b30000;
            margin-top: 30px;
        }


        .qr-button {
            font-size: 22px;
            padding: 18px 35px;
            background-color: #ff6666;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 50px;
            transition: all 0.3s ease;
        }

        .qr-button:hover {
            background-color: #e60000;
        }
    </style>
</head>
<body>

    <div class="banner"></div>

    <h1>Restorana Hoşgeldiniz</h1>

    <form action="/qr" method="GET">
        <button class="qr-button" type="submit">QR GİRİŞİ</button>
    </form>

    <form action="/rapor" method="GET">
        <button class="qr-button" type="submit">RAPORLAR</button>
    </form>

    <form action="/ozellesmisrapor" method="GET">
        <button class="qr-button" type="submit">ÖZELLEŞMİŞ RAPOR</button>
    </form>
</body>
</html>
